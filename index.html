<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='15' fill='%23E44C31'/%3E%3Cpath d='M7 23V10h3l6 9 6-9h3v13h-3v-8l-6 9-6-9v8z' fill='%23fff'/%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,400..700;1,400&display=swap" rel="stylesheet" />
    <title data-en="Saint Petersburg Metro — interactive map and travel times">Метро Санкт-Петербурга —  интерактивная карта и время в пути</title>
    <meta name="description" content="Интерактивная карта метро Петербурга: маршрут, время в пути и пересадки между любыми двумя станциями. История сети с 1950-х и планы развития до 2040 года." />
    <link rel="canonical" href="https://gkalian.github.io/metro/" />
    <!-- Link previews (Telegram, VK, WhatsApp, Slack, X…) need absolute URLs -->
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="ru_RU" />
    <meta property="og:site_name" content="Метро Санкт-Петербурга" />
    <meta property="og:title" content="Метро Санкт-Петербурга — интерактивная карта и время в пути" />
    <meta property="og:description" content="Маршрут, время в пути и пересадки между любыми двумя станциями. История сети с 1950-х и планы развития до 2040 года." />
    <meta property="og:url" content="https://gkalian.github.io/metro/" />
    <meta property="og:image" content="https://gkalian.github.io/metro/og.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Карта метро Петербурга в светлой и тёмной теме" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="map"></div>

    <button id="sidebar-toggle" class="sidebar-toggle" type="button" aria-controls="panel" aria-expanded="true" title="Свернуть панель" aria-label="Свернуть панель">
      <span class="sidebar-toggle__chevron" aria-hidden="true"></span>
    </button>
    <aside class="panel" id="panel">
      <header class="panel__head">
        <h1 data-en="Saint Petersburg Metro">Метро Санкт-Петербурга</h1>
        <div class="panel__actions">
          <button id="lang" class="icon-btn icon-btn--text" type="button" title="Язык / Language">RU</button>
          <button id="theme" class="icon-btn" type="button" title="Светлая / тёмная карта" aria-label="Сменить тему" data-en-title="Light / dark map" data-en-aria-label="Switch theme">◐</button>
        </div>
      </header>

      <div class="pickers">
        <div class="pickers__fields">
          <div class="picker" id="picker-from"></div>
          <div class="picker" id="picker-to"></div>
        </div>
        <button id="swap" class="icon-btn" type="button" title="Поменять местами" aria-label="Поменять местами" data-en-title="Swap" data-en-aria-label="Swap">⇅</button>
      </div>

      <section id="result" class="result" aria-live="polite"></section>

      <div class="options">
        <label class="option"><input type="checkbox" id="show-rail" /> <span data-en="Show railway stations">Показывать железнодорожные станции</span></label>
        <label class="option"><input type="checkbox" id="show-planned" /> <span data-en="Show future stations">Показывать будущие станции</span></label>
      </div>

      <section class="fold">
        <button id="chronology-toggle" class="fold__toggle" type="button" aria-expanded="true" aria-controls="chronology">
          <span><span data-en="Chronology">Хронология</span><span id="chronology-value" class="fold__value"></span></span>
          <span class="fold__chevron" aria-hidden="true"></span>
        </button>
        <div id="chronology" class="fold__body chronology">
          <input type="range" id="horizon" min="0" step="1" value="0" aria-label="Состояние сети на год" data-en-aria-label="Network as of year" />
          <div class="chronology__ticks" id="horizon-ticks"></div>
        </div>
      </section>

      <section class="fold fold--legend">
        <button id="legend-toggle" class="fold__toggle" type="button" aria-expanded="false" aria-controls="legend">
          <span data-en="Legend">Условные обозначения</span>
          <span class="fold__chevron" aria-hidden="true"></span>
        </button>
        <ul id="legend" class="fold__body legend" hidden></ul>
      </section>

      <footer class="footer">
        <span>gkalian © 2026</span>
        <span class="footer__sep" aria-hidden="true">|</span>
        <a class="footer__link" href="https://github.com/gkalian/metro" target="_blank" rel="noopener noreferrer" title="Исходный код на GitHub" aria-label="Исходный код на GitHub" data-en-title="Source code on GitHub" data-en-aria-label="Source code on GitHub">
          <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true">
            <path fill="currentColor" d="M8 0c4.42 0 8 3.58 8 8a8.013 8.013 0 0 1-5.45 7.59c-.4.08-.55-.17-.55-.38 0-.27.01-1.13.01-2.2 0-.75-.25-1.23-.54-1.48 1.78-.2 3.65-.88 3.65-3.95 0-.88-.31-1.59-.82-2.15.08-.2.36-1.02-.08-2.12 0 0-.67-.22-2.2.82-.64-.18-1.32-.27-2-.27-.68 0-1.36.09-2 .27-1.53-1.03-2.2-.82-2.2-.82-.44 1.1-.16 1.92-.08 2.12-.51.56-.82 1.28-.82 2.15 0 3.06 1.86 3.75 3.64 3.95-.23.2-.44.55-.51 1.07-.46.21-1.61.55-2.33-.66-.15-.24-.6-.83-1.23-.82-.67.01-.27.38.01.53.34.19.73.9.82 1.13.16.45.68 1.31 2.69.94 0 .67.01 1.3.01 1.49 0 .21-.15.45-.55.38A7.995 7.995 0 0 1 0 8c0-4.42 3.58-8 8-8Z" />
          </svg>
        </a>
      </footer>
    </aside>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
